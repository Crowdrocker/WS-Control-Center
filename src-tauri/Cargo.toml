[package]
name = "ws-control-center"
version = "0.1.0"
description = "Local-first workstation control center"
authors = ["Crowdrocker"]
edition = "2021"

[lib]
name = "ws_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
